name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore bnetlauncher.sln

    - name: Build and Publish
      run: msbuild bnetlauncher.sln /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=FolderProfile

    - name: Copy files for release
      run: |
        copy bnetlauncher\Resources\gamesdb.ini gamesdb.ini.example
        copy bnetlauncher\bin\Release\ILMerge\bnetlauncher.exe bnetlauncher.exe
        copy bnetlauncher-setup\bin\Release\bnetlauncher-setup.exe bnetlauncher-setup.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        # Any tag with a hyphen (v2.26-forever.1, v2.27-beta, ...) is published as a pre-release.
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        files: |
          bnetlauncher.exe
          bnetlauncher-setup.exe
          README.md
          changelog.txt
          license.txt
          gamesdb.ini.example
